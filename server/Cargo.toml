[package]
name = "sequencer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
